<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Morning Dashboard</title>
<style>
:root { --bg: #F4F3EF; --card: #FFFFFF; --line: #E2E0D8; --ink: #17181C; --muted: #5C606B; --accent: #3B4BC8; --err: #A3261B; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111215; --card: #1A1C21; --line: #2A2D34; --ink: #EEEDE8; --muted: #9EA1AB; --accent: #8C9BFF; --err: #FF8A80; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; }
form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 26px; }
label { font-size: 13px; color: var(--muted); }
input[type=password] { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); min-height: 44px; }
.remember input { width: 18px; height: 18px; }
button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: 0.6; }
#msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--err); }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Morning Dashboard</h1>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="remember"><input id="rem" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <p id="msg" role="status"></p>
</form>

function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function derive(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256));
}
async function unlock(raw) {
  var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  var page = new TextDecoder().decode(pt);
  document.open(); document.write(page); document.close();
}
(async function () {
  var saved = null;
  try { saved = localStorage.getItem('gd-key'); } catch (e) {}
  if (saved) {
    try { await unlock(b64(saved)); return; }
    catch (e) { try { localStorage.removeItem('gd-key'); } catch (e2) {} }
  }
})();
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  msg.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
  try {
    var raw = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) { try { localStorage.setItem('gd-key', toB64(raw)); } catch (e) {} }
    await unlock(raw);
  } catch (e) {
    try { localStorage.removeItem('gd-key'); } catch (e2) {}
    msg.textContent = 'Wrong password.';
    go.disabled = false; go.textContent = 'Unlock';
  }
});
