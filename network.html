<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Morning Dashboard</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face { font-family: 'EB Garamond'; src: url(fonts/eb-garamond-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Inter'; src: url(fonts/inter-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Inter'; src: url(fonts/inter-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
:root { --bg: #BFBBB3; --card: #3A3B30; --card-top: #424337; --line: #55574A; --field: #2C2D24; --ink: #E2E9CC; --muted: #A3AA8B; --accent: #C3D19C; --accent-ink: #2C2D24; --err: #E2B866; }
@media (prefers-color-scheme: dark) { :root { --bg: #22231C; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
form { width: 100%; max-width: 360px; background: linear-gradient(180deg, var(--card-top), var(--card) 120px); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0 0 4px; font-family: 'Sabon Next LT Pro', 'Sabon Next LT', 'Sabon LT Pro', 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1; }
label { font-size: 13px; color: var(--muted); }
input[type=password] { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.remember { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); min-height: 44px; }
.remember input { width: 18px; height: 18px; accent-color: #C3D19C; }
button { font: inherit; font-weight: 600; font-size: 15px; min-height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: 0.6; }
#msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--err); }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Morning Dashboard</h1>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="remember"><input id="rem" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <p id="msg" role="status"></p>
</form>

function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function derive(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256));
}
async function decrypt(raw) {
  var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(page) { document.open(); document.write(page); document.close(); }
(async function () {
  var saved = null;
  try { saved = localStorage.getItem('gd-key') || sessionStorage.getItem('gd-key'); } catch (e) {}
  if (saved) {
    try { show(await decrypt(b64(saved))); return; }
    catch (e) { try { localStorage.removeItem('gd-key'); sessionStorage.removeItem('gd-key'); } catch (e2) {} }
  }
})();
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  msg.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
  try {
    var raw = await derive(document.getElementById('pw').value);
    var page = await decrypt(raw);
    // Save the key before swapping in the page, so the other tabs open without asking again
    try { sessionStorage.setItem('gd-key', toB64(raw)); } catch (e) {}
    if (document.getElementById('rem').checked) { try { localStorage.setItem('gd-key', toB64(raw)); } catch (e) {} }
    show(page);
  } catch (e) {
    msg.textContent = 'Wrong password.';
    go.disabled = false; go.textContent = 'Unlock';
  }
});
